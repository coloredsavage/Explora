# explora.city — static, served from the VPS.
#
# Installed at /etc/nginx/sites-available/explora.city and symlinked into
# sites-enabled. Kept in the repo so the vhost is not something that exists
# only on one disk.
#
# ! DO NOT cp THIS OVER THE LIVE FILE ONCE A CERTIFICATE IS ISSUED.
#
# This is the pre-TLS original. Certbot rewrites the live copy when it issues
# one — it appends the listen 443 block, the ssl_certificate lines and the
# port-80 redirect — and none of that is here. Copying this file over the
# live one would strip HTTPS from a domain that is already answering on it,
# and nginx -t would pass, because the result is perfectly valid nginx that
# simply no longer serves TLS.
#
# run-deploy.sh does not touch the vhost; only a person doing it by hand can
# cause this. To change the vhost after TLS: edit the live file, make the
# matching edit here, and never copy in either direction. Last live-side
# change was certbot on 2026-10-03; /root/explora.city.nginx.pre-certbot.bak
# is what it looked like before.
#
# The sslip.io name is not decoration: it resolves to this box's IP without
# touching explora.city's DNS, which is what lets the whole thing — content,
# pretty URLs, a real certificate — be verified before the domain is moved.

server {
    listen 80;
    listen [::]:80;

    server_name explora.city www.explora.city explora.187-77-25-242.sslip.io;

    # A symlink that run-deploy.sh swaps with one rename. nginx resolves it
    # per request, so a deploy never needs a reload and no request is ever
    # served a half-copied tree.
    root /var/www/explora/current;
    index index.html;

    # Pages sent `content-type: text/html; charset=utf-8`. nginx sends bare
    # `text/html` unless told, and the board has curly quotes and accented
    # venue names all through it — without this a browser that falls back to
    # latin-1 renders them as mojibake.
    charset utf-8;
    charset_types text/html text/plain text/css text/markdown
                  application/javascript application/json;

    # The board is one page plus a lot of generated directories —
    # /event/<slug>/, /live-music-in-toronto/ and so on — each holding an
    # index.html. $uri/ is what serves those. $uri.html lets /listings work
    # as well as /listings.html, which Pages also did.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ACME, over plain HTTP, for every name this block answers to and whether
    # or not that name has a certificate yet.
    #
    # This is load-bearing at the DNS cutover and nowhere else. `certbot
    # --nginx` writes `return 404` into the port-80 block for names it has
    # not issued for, which is harmless while explora.city resolves to GitHub
    # and fatal the moment it does not: the 404 goes to visitors AND to
    # Let's Encrypt, so the certificate that would end the 404 can never be
    # issued. Keeping this location, and serving the site rather than
    # redirecting, makes the move a few minutes of plain HTTP instead.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Two nginx traps are why these blocks look repetitive. Both were live
    # here and both are invisible unless you read the response headers.
    #
    #   1. `expires` emits its own Cache-Control. Pairing it with an
    #      `add_header Cache-Control` sends the header TWICE — the first cut
    #      of this file served
    #         Cache-Control: max-age=600
    #         Cache-Control: public, max-age=600
    #      and which one a cache honours is its own business. Use one or the
    #      other; this uses add_header, because `immutable` needs it anyway.
    #
    #   2. add_header does not merge with the server level, it REPLACES it.
    #      Any location that sets one loses every add_header above it, so the
    #      security headers below were being sent on exactly the responses
    #      nobody fetches and on none of the HTML. They have to be repeated
    #      in every block that adds a header of its own.
    #
    # Everything the page loads carries ?v=<sha>, rewritten at deploy time, so
    # a given URL's bytes never change: a changed file arrives under a changed
    # ?v= and a year is safe.
    location ~* \.(css|js|woff2?|png|webp|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # HTML is the thing that changes. Ten minutes matches what Pages sent
    # (cache-control: max-age=600), so the cutover does not alter how long a
    # stale board can sit in someone's browser.
    location ~* \.(html|md|txt|xml)$ {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Not the site. These are excluded from the webroot by run-deploy.sh as
    # well; this is the belt to that braces, for anything added later.
    location ~ ^/(\.git|scrape|scripts|scripts-vps|node_modules)/ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript
               application/json application/xml image/svg+xml;

    # The board is a browser-rendered calendar with no login and no forms;
    # these cost nothing and close off the obvious embarrassments.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
