# explora.city — static, served from the VPS.
#
# Installed at /etc/nginx/sites-available/explora.city and symlinked into
# sites-enabled. Certbot edits the live copy when it issues a certificate
# (it appends the listen 443 block and the ssl_* lines); this file is the
# pre-TLS original, kept in the repo so the vhost is not something that only
# exists on one disk.
#
# The sslip.io name is not decoration: it resolves to this box's IP without
# touching explora.city's DNS, which is what lets the whole thing — content,
# pretty URLs, a real certificate — be verified before the domain is moved.

server {
    listen 80;
    listen [::]:80;

    server_name explora.city www.explora.city explora.187-77-25-242.sslip.io;

    # A symlink that run-deploy.sh swaps with one rename. nginx resolves it
    # per request, so a deploy never needs a reload and no request is ever
    # served a half-copied tree.
    root /var/www/explora/current;
    index index.html;

    # The board is one page plus a lot of generated directories —
    # /event/<slug>/, /live-music-in-toronto/ and so on — each holding an
    # index.html. $uri/ is what serves those. $uri.html lets /listings work
    # as well as /listings.html, which Pages also did.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Everything the page loads carries ?v=<sha>, rewritten at deploy time,
    # so a given URL's bytes never change and it can be cached hard. Without
    # the query string these are the same files, hence `immutable` only when
    # the bust is present — nginx cannot see the query here, so a year is
    # still right: a changed file arrives under a changed ?v=.
    location ~* \.(css|js|woff2?|png|webp|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML is the thing that changes. Ten minutes matches what Pages sent
    # (cache-control: max-age=600), so the cutover does not alter how long a
    # stale board can sit in someone's browser.
    location ~* \.(html|md|txt|xml)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # Not the site. These are excluded from the webroot by run-deploy.sh as
    # well; this is the belt to that braces, for anything added later.
    location ~ ^/(\.git|scrape|scripts|scripts-vps|node_modules)/ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript
               application/json application/xml image/svg+xml;

    # The board is a browser-rendered calendar with no login and no forms;
    # these cost nothing and close off the obvious embarrassments.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
