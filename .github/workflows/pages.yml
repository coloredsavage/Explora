name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to mint an id-token for Pages and write the deployment;
# nothing here needs write access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). This step cannot switch it on: creating the Pages
      # site needs more than the workflow token is granted, and asking it to
      # fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      # There is no build step: the site is the repository.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
