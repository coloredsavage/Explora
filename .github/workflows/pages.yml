name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to mint an id-token for Pages and write the deployment;
# nothing here needs write access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). This step cannot switch it on: creating the Pages
      # site needs more than the workflow token is granted, and asking it to
      # fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      # The board is drawn in the browser, so the HTML a crawler receives holds
      # no listings at all. This writes the static counterparts from data.js:
      # Event JSON-LD into the head, plus listings.html, listings.md, llms.txt,
      # robots.txt and sitemap.xml. Must run before the cache-bust below, which
      # stamps the generated page's stylesheet too.
      - name: Generate the crawlable artifacts
        run: node scripts/build-seo.mjs

      # Stamp the asset URLs with this commit so a browser can never mix a new
      # index.html with a cached older app.js — that pairing throws inside the
      # click handler and the page looks dead while reporting nothing.
      - name: Cache-bust the asset URLs
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html listings.html
          grep -o 'href="styles.css?v=[^"]*"\|src="app.js?v=[^"]*"' index.html

      # There is no build step: the site is the repository.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
