name: Poll event sources

on:
  # THE DAILY SCHEDULE LIVES ON THE VPS NOW, not here. It is
  # `explora-poll.timer` on beebot-vps, 08:30 America/Toronto, running
  # scripts-vps/run-poll.sh — which does everything the job below does, in the
  # same order.
  #
  # It moved on 2026-10-03 for two reasons:
  #
  #   1. The GitHub account was locked for billing on 2026-09-30. Every run
  #      from then on died in 3-4 seconds having executed zero steps, with the
  #      reason visible only as a check-run annotation: "The job was not
  #      started because your account is locked due to a billing issue." The
  #      board sat on 2026-09-27 data for six days and nothing said so.
  #   2. Scheduled workflows run late anyway. The note that used to sit here
  #      recorded 11:17 UTC nominal firing at 15:07; the content lanes, which
  #      left for the same box in September, were seeing 2h08m to 5h18m.
  #
  # The old note also warned that '*/2' in a day-of-month field means the odd
  # days — 1, 3, 5 … 31 — not "every 48 hours". Worth keeping: a systemd
  # OnCalendar has its own version of that trap.
  #
  # Everything below still works and is still the way to run this by hand.
  # Restoring the schedule means deleting the timer first:
  #   ssh beebot-vps 'systemctl disable --now explora-poll.timer'
  #
  # Anything that can push can start a run. The Claude Code GitHub App holds
  # contents:write but not actions:write, so dispatching the workflow through
  # the API returns 403 — pushing to one of these branches is the way round it.
  #   git push origin main:run-discover   -> report on every source
  #   git push origin main:run-poll       -> a real poll and a pull request
  #   git push origin main:run-recheck  -> re-read every price, not just the
  #                                         missing ones
  #   git push origin main:show/fort-york -> print what that listing's page
  #                                         actually says about price, and
  #                                         write nothing
  push:
    branches: [run-discover, run-poll, run-recheck, 'show/**']

  workflow_dispatch:
    inputs:
      discover:
        description: 'Report how each source is best read, and poll nothing'
        type: boolean
        default: false
      all_prices:
        description: 'Re-read every price, not only the listings missing one'
        type: boolean
        default: false
      allow_silent:
        description: 'Sources allowed to return nothing, comma separated (e.g. tpl)'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The offline suite runs first: if the extractors are broken, find out
      # before hitting anyone's servers.
      - name: Test the extractors offline
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Settling a price that looks wrong in a diff, from a machine that
      # cannot reach the page. Reads one listing's source and prints the
      # price-bearing lines plus the model's reading and its quote.
      - name: Show what one listing's page says about price
        if: ${{ startsWith(github.ref_name, 'show/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scrape/recheck.mjs --show "${GITHUB_REF_NAME#show/}"

      - name: Report how each source is best read
        if: ${{ inputs.discover || github.ref_name == 'run-discover' }}
        run: node scrape/discover.mjs --all

      - name: Poll the sources
        if: ${{ !(inputs.discover || github.ref_name == 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        env:
          # Optional. Without it, pages that publish no JSON-LD are reported as
          # skipped rather than read by the model, and the job still succeeds.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The escape hatch run.mjs documents, which had no way to be reached
          # from here. A source that has genuinely gone quiet — a season that
          # ended, a venue that closed — otherwise stops every poll after it
          # until somebody edits the code.
          ALLOW_SILENT_SOURCES: ${{ inputs.allow_silent }}
        run: node scrape/run.mjs

      # What the poll just wrote, checked against the ways a description has
      # gone wrong before — a credit block, a meeting point, an ellipsis on a
      # finished sentence. Printed into the run so a bad batch is visible here
      # rather than on the site. Never fails the job: a thin description is
      # sometimes the honest answer and should not block a deploy.
      - name: Read over the descriptions
        if: ${{ !startsWith(github.ref_name, 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        continue-on-error: true
        run: node scripts/audit-descriptions.mjs

      # Every schedule on the board, checked against the ways one has been
      # wrong. The Toronto Flea was listed as a weekly Sunday market because
      # its source was an aggregator summarising a season as "Sundays
      # May-October"; the organiser runs it a handful of times. It showed on
      # twenty-seven Sundays and the social pipeline posted two of them.
      # A repeating schedule is a claim about every date it generates, and
      # something downstream posts all of them. Never fails the job.
      - name: Read over the schedules
        if: ${{ !(inputs.discover || github.ref_name == 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        continue-on-error: true
        run: node scripts/audit-schedules.mjs

      # Street festivals and block parties the board does not have, read out
      # of the City's noise exemption permits — the one City feed that is not
      # behind the Akamai block on secure.toronto.ca. Printed for a person to
      # take or leave: a permit carries no price, no description and no page
      # to cite, so nothing here is fit to publish on its own. Like the
      # description audit above, never fails the job.
      - name: Street events the board is missing
        if: ${{ !(inputs.discover || github.ref_name == 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        continue-on-error: true
        run: node scripts/propose-street-events.mjs

      # The poll only ever discovers new events. This goes back to the
      # hand-written listings and looks up the prices they are missing, from
      # each listing's own source — which is why thirteen of them said
      # "Ticketed" and no more. Default mode touches only listings with no
      # known price, so the work shrinks as they get filled in; --all re-reads
      # every price, and is what to run when a season turns.
      - name: Look up the prices data.js is missing
        if: ${{ !(inputs.discover || github.ref_name == 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scrape/recheck.mjs ${{ (inputs.all_prices || github.ref_name == 'run-recheck') && '--all' || '' }}

      - name: Did anything change?
        id: diff
        if: ${{ !(inputs.discover || github.ref_name == 'run-discover') && !startsWith(github.ref_name, 'show/') }}
        run: |
          # price-attempts.json belongs in this list: it is the recheck's memory
          # of which pages have already answered "no price". Left uncommitted it
          # is written on the runner and thrown away with it, every listing is
          # asked again on the next run, and the backoff silently does nothing.
          files='scraped.js data.js scrape/price-attempts.json'
          if git diff --quiet -- $files; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing changed.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- $files
          fi

      # A pull request rather than a push to main: a person still decides what
      # lands on the calendar. Merging it triggers the Pages deploy.
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="poll/$(date -u +%Y-%m-%d)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add scraped.js data.js scrape/price-attempts.json
          git commit -m "Polled event sources on $(date -u +%Y-%m-%d)"

          # The checkout is shallow and fetches only the default branch, so if
          # today's poll branch already exists on the remote there is no
          # tracking ref for --force-with-lease to compare against and it
          # refuses with "stale info". Fetch the ref first so the lease has a
          # basis. poll/* is bot-owned and disposable: each run rebuilds it
          # from main as a single commit, so replacing it is the intent.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease -u origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; it now has the latest poll."
            exit 0
          fi

          body='Automated poll of the sources in `scrape/sources.mjs`, plus a
          price lookup for any hand-written listing that had none.

          Check the diff before merging — listings are only as good as the pages
          they came from. Each entry carries the URL it was read from in its
          `source` field.

          Read the `data.js` half with particular care. A wrong price is worse
          than a missing one, because someone turns up with the wrong money.
          The job refuses anything vaguer than a plain figure and leaves the
          listing alone instead, but it is reading someone else'"'"'s page, and the
          run log says whether each price came from structured data or from the
          model.

          Merging deploys to Pages.'

          # Creating a PR needs "Allow GitHub Actions to create and approve pull
          # requests" under Settings -> Actions -> General. The poll itself has
          # already succeeded and the branch is pushed, so if that setting is off
          # this is a warning with a link, not a failed run.
          if ! gh pr create --base main --head "$branch" \
                 --title "Polled event sources on $(date -u +%Y-%m-%d)" \
                 --body "$body"; then
            echo "::warning title=Could not open the pull request::The branch $branch is pushed. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings -> Actions -> General, or open it yourself: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          fi
