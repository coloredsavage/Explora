name: Poll event sources

on:
  schedule:
    # 11:17 UTC — early morning in Toronto, and off the hour so this job is not
    # queued behind everyone else's midnight cron.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Report how each source is best read, and poll nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The offline suite runs first: if the extractors are broken, find out
      # before hitting anyone's servers.
      - name: Test the extractors offline
        run: node scrape/test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Report how each source is best read
        if: inputs.discover
        run: node scrape/discover.mjs

      - name: Poll the sources
        if: ${{ !inputs.discover }}
        env:
          # Optional. Without it, pages that publish no JSON-LD are reported as
          # skipped rather than read by the model, and the job still succeeds.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scrape/run.mjs

      - name: Did anything change?
        id: diff
        if: ${{ !inputs.discover }}
        run: |
          if git diff --quiet -- scraped.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No change in scraped.js.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- scraped.js
          fi

      # A pull request rather than a push to main: a person still decides what
      # lands on the calendar. Merging it triggers the Pages deploy.
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="poll/$(date -u +%Y-%m-%d)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add scraped.js
          git commit -m "Polled event sources on $(date -u +%Y-%m-%d)"

          # The checkout is shallow and fetches only the default branch, so if
          # today's poll branch already exists on the remote there is no
          # tracking ref for --force-with-lease to compare against and it
          # refuses with "stale info". Fetch the ref first so the lease has a
          # basis. poll/* is bot-owned and disposable: each run rebuilds it
          # from main as a single commit, so replacing it is the intent.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease -u origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; it now has the latest poll."
            exit 0
          fi

          body='Automated poll of the sources in `scrape/sources.mjs`.

          Check the diff before merging — listings are only as good as the pages
          they came from. Each entry carries the URL it was read from in its
          `source` field.

          Merging deploys to Pages.'

          # Creating a PR needs "Allow GitHub Actions to create and approve pull
          # requests" under Settings -> Actions -> General. The poll itself has
          # already succeeded and the branch is pushed, so if that setting is off
          # this is a warning with a link, not a failed run.
          if ! gh pr create --base main --head "$branch" \
                 --title "Polled event sources on $(date -u +%Y-%m-%d)" \
                 --body "$body"; then
            echo "::warning title=Could not open the pull request::The branch $branch is pushed. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings -> Actions -> General, or open it yourself: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          fi
